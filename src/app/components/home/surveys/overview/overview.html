<section class="general_overview">
    <div class="general_overview_header">
        <div class="general_overview_header_buttons">
            <app-selector-button surveyStatus="active" [(selectedSurveyStatus)]="selectedSurveyStatus">Active
                survey</app-selector-button>
            <app-selector-button surveyStatus="past" [(selectedSurveyStatus)]="selectedSurveyStatus">Past
                survey</app-selector-button>
        </div>
        <app-dropdown-menu (categorySelected)="selectCategory($event)"></app-dropdown-menu>
    </div>
    <div class="survey_list" id="surveyList">
        @for (survey of displayedSurveys(); track survey.id) {
        <app-card class="survey_card" [routerLink]="['/showSingleSurvey', survey.id]">
            <div>
                <p class="survey_card_category"> {{ survey.category }} </p>
                <h5 class="survey_card_title"> {{ survey.name }} </h5>
            </div>
            @if (isSurveyAvailabel(survey.date)) {
            <p class="survey_card_ends_in">Ends in {{ surveyEndsIn(survey.date) }} days</p>
            } @else {
            <p class="survey_card_ends_in">Ended on {{ survey.date | date:'mediumDate' }}</p>
            }
        </app-card>
        }
    </div>
</section>
