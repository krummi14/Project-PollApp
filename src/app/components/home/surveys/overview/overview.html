<section class="general_overview">
    <div class="general_overview_header">
        <div class="general_overview_header_buttons">
            <button>Active servey</button>
            <button>Past servey</button>
        </div>
        <app-dropdown-menu></app-dropdown-menu>
    </div>
    <div class="survey_list" id="surveyList">
        @for (survey of allSurveys(); track $index) {
        <app-card>
            <p> {{ survey.category }} </p>
            <h5> {{ survey.name }} </h5>
            <p>Ends in {{ surveyEndsIn(survey.date) }} days</p>
        </app-card>
        }
    </div>
</section>
